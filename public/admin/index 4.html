<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Meher Luna – অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2118;
  --muted:#7a6a58;
  --gold:#a98f5f;
  --gold-deep:#7d6538;
  --sand:#f1e1d0;
  --paper:#fbf6ef;
  --card:#ffffff;
  --line:#e8d9c6;
  --ok:#3f7a4a;
  --warn:#b7791f;
  --bad:#a63d3d;
  --blue:#3b6a8a;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.2px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,var(--sand),var(--paper))}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(125,101,56,.12)}
.login-box h1{font-size:34px;color:var(--gold-deep);text-align:center}
.login-box p.sub{text-align:center;color:var(--muted);margin:2px 0 22px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,143,95,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--gold-deep);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--gold-deep);border:1px solid var(--gold)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #e3bcbc}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px;text-align:center}

/* shell */
#app{display:none}
header.top{position:sticky;top:0;z-index:5;background:var(--gold);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header.top .brand{font-size:24px}
header.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
nav.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--sand);position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:4;overflow-x:auto}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button.on{background:var(--gold-deep);color:#fff}
main{max-width:860px;margin:0 auto;padding:14px 12px 60px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}

/* orders */
.oid{font-weight:700}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#eee}
.s-pending{background:#fff1d6;color:var(--warn)}
.s-confirmed{background:#dcebf5;color:var(--blue)}
.s-shipped{background:#e6e0f5;color:#5b4a9a}
.s-delivered{background:#dcefe0;color:var(--ok)}
.s-cancelled,.s-returned{background:#f6dcdc;color:var(--bad)}
.items{margin:8px 0;padding:8px 10px;background:var(--paper);border-radius:10px;font-size:15px}
.items div{display:flex;justify-content:space-between;gap:10px}
.total{font-weight:700;display:flex;justify-content:space-between;margin-top:6px}
a.tel{color:var(--gold-deep);font-weight:600;text-decoration:none}

/* products */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--sand);flex:none}
.pname{font-weight:600}
.off{opacity:.55}
.switch{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.switch input{width:auto}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.show{opacity:1}
#toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="loginForm" autocomplete="on">
    <h1 class="brand">Meher Luna</h1>
    <p class="sub">অ্যাডমিন লগইন</p>
    <label for="u">ইউজারনেম</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" required>
    <label for="p">পাসওয়ার্ড</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn block" id="loginBtn" type="submit">লগইন করুন</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app">
  <header class="top">
    <span class="brand">Meher Luna</span>
    <button id="logout" type="button">লগআউট</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="orders" class="on">অর্ডার</button>
    <button data-tab="products">প্রোডাক্ট</button>
    <button data-tab="delivery">ডেলিভারি চার্জ</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var API = '/api/admin';
  var STATUS = {
    pending: 'অপেক্ষমাণ', confirmed: 'নিশ্চিত', shipped: 'পাঠানো হয়েছে',
    delivered: 'পৌঁছেছে', cancelled: 'বাতিল', returned: 'ফেরত'
  };
  var auth = null;
  try { auth = sessionStorage.getItem('ml_auth'); } catch (e) {}
  var state = { tab: 'orders', filter: '', locs: null };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var view = $('#view');

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return '৳' + Number(n || 0).toLocaleString('en-IN'); }
  function toast(msg, bad) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, 2400);
  }
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Authorization': 'Basic ' + auth };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(API + path, {
      method: opts.method || 'GET', headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 401) { signOut('সেশন শেষ হয়েছে। আবার লগইন করুন।'); throw new Error('401'); }
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d && d.error ? d.error : 'কিছু ভুল হয়েছে');
        return d;
      });
    });
  }

  /* ---------- login ---------- */
  function showApp() { $('#login').style.display = 'none'; $('#app').style.display = 'block'; render(); }
  function signOut(msg) {
    auth = null; try { sessionStorage.removeItem('ml_auth'); } catch (e) {}
    $('#app').style.display = 'none'; $('#login').style.display = 'flex';
    $('#loginErr').textContent = msg || '';
  }
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
    auth = b64($('#u').value + ':' + $('#p').value);
    fetch(API + '/settings', { headers: { 'Authorization': 'Basic ' + auth } }).then(function (r) {
      if (r.status === 401) throw new Error('ইউজারনেম বা পাসওয়ার্ড ভুল। Netlify-র ADMIN_USER ও ADMIN_PASS মিলিয়ে দেখুন।');
      if (!r.ok) throw new Error('সার্ভারে সমস্যা (কোড ' + r.status + ')। Supabase সেটিং দেখুন।');
      try { sessionStorage.setItem('ml_auth', auth); } catch (e) {}
      $('#p').value = ''; showApp();
    }).catch(function (err) {
      auth = null; $('#loginErr').textContent = err.message || 'নেটওয়ার্ক সমস্যা';
    }).then(function () { btn.disabled = false; });
  });
  $('#logout').addEventListener('click', function () { signOut(''); });

  /* ---------- tabs ---------- */
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    state.tab = b.getAttribute('data-tab');
    Array.prototype.forEach.call($('#tabs').children, function (x) { x.classList.toggle('on', x === b); });
    render();
  });
  function render() {
    view.innerHTML = '<div class="empty">লোড হচ্ছে…</div>';
    var p = state.tab === 'orders' ? renderOrders() : state.tab === 'products' ? renderProducts() : renderDelivery();
    p.catch(function (e) { if (e.message !== '401') view.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  /* ---------- orders ---------- */
  function renderOrders() {
    var q = state.filter ? '?status=' + encodeURIComponent(state.filter) : '';
    return api('/orders' + q).then(function (orders) {
      var chips = '<button class="chip' + (state.filter ? '' : ' on') + '" data-f="">সব</button>' +
        Object.keys(STATUS).map(function (k) {
          return '<button class="chip' + (state.filter === k ? ' on' : '') + '" data-f="' + k + '">' + STATUS[k] + '</button>';
        }).join('');
      var html = '<div class="row spread" style="margin-bottom:8px"><strong>' + orders.length + 'টি অর্ডার</strong>' +
        '<button class="btn ghost small" id="reload">রিফ্রেশ</button></div><div class="chips" id="chips">' + chips + '</div>';
      if (!orders.length) html += '<div class="empty">কোনো অর্ডার নেই</div>';
      html += orders.map(orderCard).join('');
      view.innerHTML = html;
      $('#reload').onclick = render;
      $('#chips').onclick = function (e) {
        var c = e.target.closest('.chip'); if (!c) return;
        state.filter = c.getAttribute('data-f'); render();
      };
      view.onchange = function (e) {
        var s = e.target.closest('select[data-order]'); if (!s) return;
        api('/orders/' + s.getAttribute('data-order'), { method: 'PATCH', body: { status: s.value } })
          .then(function () { toast('স্ট্যাটাস বদলানো হয়েছে'); var b = s.closest('.card').querySelector('.badge'); b.className = 'badge s-' + s.value; b.textContent = STATUS[s.value]; })
          .catch(function (er) { if (er.message !== '401') toast(er.message, true); });
      };
    });
  }
  function orderCard(o) {
    var code = o.public_id || o.publicId || o.order_id || ('#' + o.id);
    var when = o.created_at ? new Date(o.created_at).toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka', dateStyle: 'medium', timeStyle: 'short' }) : '';
    var items = (o.items || []).map(function (i) {
      return '<div><span>' + esc(i.name) + ' × ' + esc(i.qty) + '</span><span>' + money(i.price * i.qty) + '</span></div>';
    }).join('');
    var ship = o.delivery_charge != null ? o.delivery_charge : o.deliveryCharge;
    var opts = Object.keys(STATUS).map(function (k) {
      return '<option value="' + k + '"' + (o.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>';
    }).join('');
    return '<div class="card">' +
      '<div class="row spread"><span class="oid">' + esc(code) + '</span><span class="badge s-' + esc(o.status) + '">' + esc(STATUS[o.status] || o.status) + '</span></div>' +
      '<div class="muted">' + esc(when) + '</div>' +
      '<div style="margin-top:8px"><strong>' + esc(o.name) + '</strong> · <a class="tel" href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a></div>' +
      '<div class="muted">' + esc([o.address, o.upazila, o.district, o.division].filter(Boolean).join(', ')) + '</div>' +
      (o.note ? '<div class="muted">নোট: ' + esc(o.note) + '</div>' : '') +
      '<div class="items">' + items + '</div>' +
      (ship != null ? '<div class="row spread muted"><span>ডেলিভারি চার্জ</span><span>' + money(ship) + '</span></div>' : '') +
      '<div class="total"><span>মোট</span><span>' + money(o.total) + '</span></div>' +
      '<label style="margin-top:12px">স্ট্যাটাস পরিবর্তন</label><select data-order="' + esc(o.id) + '">' + opts + '</select>' +
      '</div>';
  }

  /* ---------- products ---------- */
  function renderProducts() {
    return api('/products').then(function (list) {
      var html = '<div class="row spread" style="margin-bottom:10px"><strong>' + list.length + 'টি প্রোডাক্ট</strong>' +
        '<button class="btn small" id="addToggle">+ নতুন প্রোডাক্ট</button></div>' +
        '<form class="card" id="addForm" style="display:none">' +
        '<label>নাম (ইংরেজি) *</label><input name="name" required>' +
        '<label>নাম (বাংলা)</label><input name="name_bn">' +
        '<div class="grid2"><div><label>দাম (৳) *</label><input name="price" type="number" min="0" inputmode="numeric" required></div>' +
        '<div><label>স্টক</label><input name="stock" type="number" min="0" inputmode="numeric" value="0"></div></div>' +
        '<label>ক্যাটাগরি</label><input name="category" placeholder="Skin care / Hair care …">' +
        '<label>ছবির লিংক</label><input name="image" placeholder="/images/… বা https://…">' +
        '<label>বিবরণ</label><textarea name="description" rows="3"></textarea>' +
        '<button class="btn block" type="submit">প্রোডাক্ট যোগ করুন</button></form>';
      if (!list.length) html += '<div class="empty">এখনও কোনো প্রোডাক্ট নেই</div>';
      html += list.map(function (p) {
        return '<div class="card' + (p.active === false ? ' off' : '') + '" data-pid="' + esc(p.id) + '">' +
          '<div class="row" style="flex-wrap:nowrap">' +
          (p.image ? '<img class="thumb" src="' + esc(p.image) + '" alt="" loading="lazy">' : '<div class="thumb"></div>') +
          '<div><div class="pname">' + esc(p.name) + '</div><div class="muted">' + esc(p.category || '') + '</div></div></div>' +
          '<div class="grid2" style="margin-top:8px"><div><label>দাম (৳)</label><input data-k="price" type="number" min="0" inputmode="numeric" value="' + esc(p.price) + '"></div>' +
          '<div><label>স্টক</label><input data-k="stock" type="number" min="0" inputmode="numeric" value="' + esc(p.stock) + '"></div></div>' +
          '<div class="row spread" style="margin-top:12px"><label class="switch" style="margin:0"><input data-k="active" type="checkbox"' + (p.active === false ? '' : ' checked') + '> সাইটে দেখান</label>' +
          '<button class="btn small" data-save="1">সেভ করুন</button></div></div>';
      }).join('');
      view.innerHTML = html;
      $('#addToggle').onclick = function () { var f = $('#addForm'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; };
      $('#addForm').onsubmit = function (e) {
        e.preventDefault();
        var d = {}; new FormData(e.target).forEach(function (v, k) { d[k] = v; });
        api('/products', { method: 'POST', body: d }).then(function () { toast('প্রোডাক্ট যোগ হয়েছে'); render(); })
          .catch(function (er) { if (er.message !== '401') toast(er.message, true); });
      };
      view.onclick = function (e) {
        var b = e.target.closest('button[data-save]'); if (!b) return;
        var card = b.closest('.card');
        var body = {
          price: card.querySelector('[data-k=price]').value,
          stock: card.querySelector('[data-k=stock]').value,
          active: card.querySelector('[data-k=active]').checked
        };
        b.disabled = true;
        api('/products/' + card.getAttribute('data-pid'), { method: 'PUT', body: body })
          .then(function () { toast('সেভ হয়েছে'); card.classList.toggle('off', !body.active); })
          .catch(function (er) { if (er.message !== '401') toast(er.message, true); })
          .then(function () { b.disabled = false; });
      };
    });
  }

  /* ---------- delivery ---------- */
  function getLocs() {
    if (state.locs) return Promise.resolve(state.locs);
    return fetch('/api/locations').then(function (r) { return r.json(); }).then(function (loc) {
      var d = []; Object.keys(loc).forEach(function (div) { d = d.concat(Object.keys(loc[div])); });
      state.locs = d.sort(); return state.locs;
    });
  }
  function renderDelivery() {
    return Promise.all([api('/settings'), getLocs()]).then(function (res) {
      var s = res[0], districts = res[1];
      var html = '<div class="card"><strong>সাধারণ ডেলিভারি চার্জ</strong>' +
        '<label>ডিফল্ট চার্জ (৳)</label><input id="dc" type="number" min="0" inputmode="numeric" value="' + esc(s.default_charge) + '">' +
        '<label>এই টাকার বেশি অর্ডারে ডেলিভারি ফ্রি (৳, ০ = বন্ধ)</label><input id="fd" type="number" min="0" inputmode="numeric" value="' + esc(s.free_delivery_over) + '">' +
        '<button class="btn block" id="saveSet">সেভ করুন</button></div>' +
        '<div class="card"><strong>জেলা অনুযায়ী আলাদা চার্জ</strong>' +
        '<p class="muted">যে জেলার চার্জ আলাদা নেই, সেখানে ডিফল্ট চার্জ লাগবে।</p>' +
        '<label>জেলা</label><select id="dist">' + districts.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join('') + '</select>' +
        '<label>চার্জ (৳)</label><input id="dch" type="number" min="0" inputmode="numeric">' +
        '<button class="btn block" id="saveDist">জেলার চার্জ সেভ করুন</button></div>';
      var list = s.districts || [];
      html += '<div class="card"><strong>আলাদা চার্জ সেট করা জেলা</strong>' +
        (list.length ? list.map(function (r) {
          return '<div class="row spread" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>' + esc(r.district) + ' — ' + money(r.charge) + '</span>' +
            '<button class="btn danger small" data-del="' + esc(r.district) + '">সরান</button></div>';
        }).join('') : '<div class="muted" style="margin-top:6px">এখনও কোনো জেলার আলাদা চার্জ নেই</div>') + '</div>';
      view.innerHTML = html;
      $('#saveSet').onclick = function () {
        api('/settings', { method: 'PUT', body: { default_charge: $('#dc').value, free_delivery_over: $('#fd').value } })
          .then(function () { toast('সেভ হয়েছে'); }).catch(function (er) { if (er.message !== '401') toast(er.message, true); });
      };
      $('#saveDist').onclick = function () {
        if ($('#dch').value === '') { toast('চার্জের টাকা লিখুন', true); return; }
        api('/district-charge', { method: 'PUT', body: { district: $('#dist').value, charge: $('#dch').value } })
          .then(function () { toast('সেভ হয়েছে'); render(); }).catch(function (er) { if (er.message !== '401') toast(er.message, true); });
      };
      view.onclick = function (e) {
        var b = e.target.closest('button[data-del]'); if (!b) return;
        api('/district-charge', { method: 'PUT', body: { district: b.getAttribute('data-del'), charge: '' } })
          .then(function () { toast('সরানো হয়েছে'); render(); }).catch(function (er) { if (er.message !== '401') toast(er.message, true); });
      };
    });
  }

  if (auth) showApp();
})();
</script>
</body>
</html>
