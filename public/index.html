:root{--bg:#fbf6f1;--ink:#3a2f26;--muted:#8a7a6e;--accent:#b08a4e;--accent-d:#94713a;--card:#fff;--line:#ecdfd3;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.serif{font-family:'Cormorant Garamond',serif}
header{position:sticky;top:0;z-index:20;background:rgba(250,247,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;letter-spacing:.5px}
.nav-r{display:flex;gap:10px;align-items:center}
.nav-l{display:flex;gap:22px;font-size:15px;color:var(--muted)}
.nav-l a:hover{color:var(--ink)}
.btn{border:1px solid var(--ink);background:none;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.btn.fill{background:var(--ink);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:var(--accent-d)}
.cartbtn{position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center}
.hero{padding-top:70px;padding-bottom:60px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-family:'Cormorant Garamond','Hind Siliguri',serif;font-size:clamp(38px,6vw,64px);line-height:1.1;font-weight:500}
.hero p{color:var(--muted);margin:18px 0 28px;max-width:440px}
.hero-art{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;background:linear-gradient(160deg,#f1d9d0,#e3b9ad 60%,#c98f82);position:relative;overflow:hidden}
.hero-art::after{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);right:-10%;top:12%}
.sec{padding-top:50px;padding-bottom:50px}
.sec h2{font-family:'Cormorant Garamond','Hind Siliguri',serif;font-size:34px;font-weight:500;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:26px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);background:#fff;padding:6px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:42px;color:rgba(255,255,255,.9)}
.thumb.photo{background:#fff;padding:10px}
.thumb.photo img{width:100%;height:100%;object-fit:contain}
.social{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.social a:hover{border-color:var(--accent);color:var(--accent-d)}
.social svg{width:16px;height:16px;fill:currentColor}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:6px 0 44px}
.catcard{position:relative;display:block;aspect-ratio:1/1.1;border-radius:22px;overflow:hidden;background:#eee;box-shadow:0 8px 24px rgba(120,90,60,.12)}
.catcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.catcard:hover img{transform:scale(1.04)}
.catcard .cl{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;color:#fff;background:linear-gradient(to top,rgba(30,20,12,.78),rgba(30,20,12,0))}
.catcard .cl b{display:block;font-family:'Cormorant Garamond','Hind Siliguri',serif;font-size:26px;font-weight:600;line-height:1.15}
.catcard .cl span{font-size:13px;opacity:.92}
.catsec{margin-bottom:46px;scroll-margin-top:80px}
.catsec>h3{font-family:'Cormorant Garamond','Hind Siliguri',serif;font-size:30px;font-weight:500}
.card .d{font-size:13px;color:var(--muted);line-height:1.45;margin:2px 0 6px}
.card .price.ask{font-weight:500;font-size:13px;color:var(--accent-d)}
.card a.btn{display:block;text-align:center;margin-top:auto}
.card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:16px;font-weight:500}
.cat{font-size:12px;color:var(--muted)}
.price{font-weight:600;margin-top:2px}
.card .btn{margin-top:auto;width:100%}
.about{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feat{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff}
.feat b{display:block;margin-bottom:4px}
.feat span{color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:34px 0;color:var(--muted);font-size:14px}
.fr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--wa);color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.wa-float svg{width:28px;height:28px;fill:#fff}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:#fff;z-index:40;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.1)}
.drawer.open{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.items{flex:1;overflow:auto;padding:10px 20px}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.df{padding:18px 20px;border-top:1px solid var(--line)}
.df input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px}
.wabtn{width:100%;background:var(--wa);border:none;color:#fff;padding:12px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35;display:none}
.ov.on{display:block}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.banner{margin-top:24px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(120,90,60,.12)}
.banner img{display:block;width:100%;height:auto}
.hero{display:block;text-align:center;padding-top:34px;padding-bottom:20px}
.hero p{margin:14px auto 22px}
.foot-logo{width:64px;height:64px;border-radius:50%;margin-bottom:8px;object-fit:cover}
@media(max-width:760px){.cats{grid-template-columns:1fr}.catcard{aspect-ratio:4/3}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card h3{font-size:14px}.card .b{padding:10px 12px 12px}.card .d{font-size:12px}.card .btn{padding:7px 10px;font-size:13px}.catsec>h3{font-size:26px}.hero{grid-template-columns:1fr;padding-top:36px}.hero-art{aspect-ratio:1;border-radius:120px 120px 20px 20px;order:-1}.nav-l{display:none}.about{grid-template-columns:1fr}}
</style>
</head>

let lang=localStorage.getItem("ml_lang")||"bn",cat="all",cart={};
try{cart=JSON.parse(localStorage.getItem("ml_cart2")||"{}")}catch(e){}
const $=s=>document.querySelector(s);
const bnNum=n=>lang==="bn"?String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]):String(n);
const money=n=>"৳"+bnNum(n.toLocaleString("en-US"));
const t=k=>T[lang][k];

function card(p){
  const th=p.img?`<div class="thumb photo"><img src="${p.img}" alt="${p.en}" loading="lazy"></div>`
    :`<div class="thumb" style="background:linear-gradient(145deg,${p.c[0]},${p.c[1]})">M</div>`;
  const act=p.price
    ?`<div class="price">${money(p.price)}</div><button class="btn" data-add="${p.id}">${t("add")}</button>`
    :`<div class="price ask">${t("ask")}</div><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t("ask_msg")+" "+p.en)}">${t("ask_btn")}</a>`;
  return `<div class="card">${th}<div class="b"><h3>${p[lang]}</h3><p class="d">${p["d"+lang]}</p>${act}</div></div>`;
}
function render(){
  document.documentElement.lang=lang;
  $("#lang").textContent=lang==="bn"?"EN":"বাংলা";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  $("#cats").innerHTML=CATS.map(c=>`<a class="catcard" href="#cat-${c.id}"><img src="${c.img}" alt="${c[lang]}" style="object-position:${c.pos}"><div class="cl"><b>${c[lang]}</b><span>${c["d"+lang]}</span></div></a>`).join("");
  $("#catalog").innerHTML=CATS.map(c=>`<div class="catsec" id="cat-${c.id}"><h3>${c[lang]}</h3><p class="sub">${c["d"+lang]}</p><div class="grid">${PRODUCTS.filter(p=>p.cat===c.id).map(card).join("")}</div></div>`).join("");
  renderCart();
}
function renderCart(){
  const ids=Object.keys(cart).filter(id=>cart[id]>0&&PRODUCTS.some(x=>x.id==id&&x.price));
  let total=0,count=0;
  $("#items").innerHTML=ids.length?ids.map(id=>{
    const p=PRODUCTS.find(x=>x.id==id);const q=cart[id];total+=p.price*q;count+=q;
    return `<div class="it"><div><div>${p[lang]}</div><div class="qty"><button data-m="${id}">−</button>${bnNum(q)}<button data-p="${id}">+</button></div></div><div>${money(p.price*q)}</div></div>`;
  }).join(""):`<div class="empty">${t("empty")}</div>`;
  $("#total").textContent=money(total);$("#count").textContent=bnNum(count);
  localStorage.setItem("ml_cart2",JSON.stringify(cart));
}
function openC(o){$("#drawer").classList.toggle("open",o);$("#ov").classList.toggle("on",o)}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){cart[a.dataset.add]=(cart[a.dataset.add]||0)+1;renderCart();openC(true)}
  const m=e.target.closest("[data-m]");if(m){cart[m.dataset.m]--;renderCart()}
  const p=e.target.closest("button[data-p]");if(p){cart[p.dataset.p]++;renderCart()}
});
$("#lang").onclick=()=>{lang=lang==="bn"?"en":"bn";localStorage.setItem("ml_lang",lang);render()};
$("#openCart").onclick=()=>openC(true);$("#closeCart").onclick=()=>openC(false);$("#ov").onclick=()=>openC(false);
$("#order").onclick=()=>{
  const ids=Object.keys(cart).filter(id=>cart[id]>0&&PRODUCTS.some(x=>x.id==id&&x.price));if(!ids.length)return;
  const n=$("#cname").value.trim(),ph=$("#cphone").value.trim(),ad=$("#caddr").value.trim();
  if(!n||!ph||!ad){alert(t("fill"));return}
  let total=0;
  const lines=ids.map(id=>{const p=PRODUCTS.find(x=>x.id==id);total+=p.price*cart[id];return `• ${p[lang]} x${cart[id]} = ৳${p.price*cart[id]}`});
  const msg=`${t("msg_h")}\n\n${lines.join("\n")}\n\n${t("msg_t")}: ৳${total}\n${t("msg_n")}: ${n}\n${t("msg_p")}: ${ph}\n${t("msg_a")}: ${ad}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
};
const wl=`https://wa.me/${WHATSAPP}`;
$("#waLink").href=wl;$("#waFloat").href=wl;$("#waShow").textContent="+"+WHATSAPP;$("#yr").textContent=new Date().getFullYear();
render();
